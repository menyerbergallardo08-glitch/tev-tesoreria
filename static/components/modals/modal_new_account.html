    <!-- MODAL NUEVA CAJA O CUENTA BANCARIA -->
    <div x-show="showNewAccountModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm overflow-y-auto">
      <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-md w-full border border-gray-100 space-y-4 my-auto max-h-[92vh] overflow-y-auto">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-teal-100 flex items-center justify-center text-teal-800 text-xl font-bold">🏦</div>
          <div>
            <h3 class="text-xl font-bold text-gray-900">Nueva Caja o Cuenta</h3>
            <p class="text-xs text-gray-500">Cree un nuevo origen o destino de fondos</p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Nombre de la Caja / Banco</label>
          <input type="text" x-model="newAccountForm.name" placeholder="Ej: Punto Bancamiga VES, Zelle, Caja Chica" class="w-full input-large border rounded-xl">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Moneda</label>
            <select x-model="newAccountForm.currency" class="w-full input-large border rounded-xl bg-white">
              <option value="USD">Dólares ($ USD)</option>
              <option value="VES">Bolívares (Bs VES)</option>
              <option value="USDT">Tether (₮ USDT)</option>
              <option value="EUR">Euros (€ EUR)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Tipo de Caja</label>
            <select x-model="newAccountForm.account_type" class="w-full input-large border rounded-xl bg-white">
              <option value="Caja Operativa">Caja Operativa (Mixta)</option>
              <option value="Caja de Ingresos">Solo Ingresos (Ventas)</option>
              <option value="Caja de Egresos">Solo Egresos (Gastos)</option>
              <option value="Banco">Banco Nacional</option>
              <option value="Billetera Digital">Billetera Digital</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Saldo Inicial</label>
          <input type="number" step="0.01" x-model.number="newAccountForm.initial_balance" placeholder="0.00" class="w-full input-large border rounded-xl">
        </div>

        <div class="grid grid-cols-2 gap-3 pt-4">
          <button @click="showNewAccountModal = false" class="py-2.5 px-3 bg-gray-100 rounded-xl text-gray-700 font-bold hover:bg-gray-200 text-sm">Cancelar</button>
          <button @click="saveNewAccount()" class="py-2.5 px-3 bg-tev-green text-white rounded-xl font-bold shadow hover:bg-tev-darkgreen text-sm">Crear Caja</button>
        </div>
      </div>
    </div>
