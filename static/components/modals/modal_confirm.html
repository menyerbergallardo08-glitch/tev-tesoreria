    <!-- MODAL CONFIRMACIÓN ANTI-ERROR -->
    <div x-show="showConfirmModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm overflow-y-auto">
      <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-lg w-full border border-gray-100 space-y-4 my-auto max-h-[92vh] overflow-y-auto">
        <div class="text-center">
          <span class="text-4xl">🛡️</span>
          <h3 class="text-xl font-black text-gray-900 mt-1">Confirmar Operación</h3>
          <p class="text-gray-500 text-xs">Verifique los datos antes de registrar en el libro</p>
        </div>

        <div class="bg-slate-50 p-4 sm:p-5 rounded-2xl border border-gray-200 space-y-2.5 text-sm">
          <div class="flex justify-between">
            <span class="text-gray-500 font-medium">Operación:</span>
            <span class="font-bold text-gray-800" x-text="formatSubtype(form.subtype)"></span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500 font-medium">Caja / Cuenta:</span>
            <span class="font-bold text-gray-800" x-text="getSelectedAccountName()"></span>
          </div>
          <div class="flex justify-between">
            <span class="text-gray-500 font-medium">Monto Original:</span>
            <span class="font-black text-gray-900" x-text="formatNumber(form.amount_original) + ' ' + selectedAccountCurrency"></span>
          </div>
          <div x-show="selectedAccountCurrency === 'VES'" class="flex justify-between">
            <span class="text-gray-500 font-medium">Tasa Aplicada:</span>
            <span class="font-bold text-gray-800" x-text="form.exchange_rate + ' Bs/$'"></span>
          </div>
          <div class="flex justify-between pt-2 border-t border-gray-200 text-base">
            <span class="text-teal-900 font-bold">Total Equivalente:</span>
            <span class="font-black text-teal-800" x-text="'$' + calculateUsdEquivalent().toFixed(2) + ' USD'"></span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button @click="showConfirmModal = false" class="py-2.5 px-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold text-xs sm:text-sm">
            ⬅️ Corregir
          </button>
          <button @click="executeSubmitTransaction()" class="py-2.5 px-3 bg-tev-green hover:bg-tev-darkgreen text-white rounded-xl font-bold text-xs sm:text-sm shadow">
            ✅ Sí, Guardar
          </button>
        </div>
      </div>
    </div>
