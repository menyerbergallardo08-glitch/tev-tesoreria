    <!-- MODAL NUEVA PARTIDA PRESUPUESTARIA -->
    <div x-show="showNewCatModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm overflow-y-auto">
      <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-md w-full border border-gray-100 space-y-4 my-auto max-h-[92vh] overflow-y-auto">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-teal-100 flex items-center justify-center text-teal-800 text-xl font-bold">➕</div>
          <div>
            <h3 class="text-xl font-bold text-gray-900">Nueva Partida Presupuestaria</h3>
            <p class="text-xs text-gray-500">Cree una nueva categoría para imputar gastos</p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Código de la Partida</label>
          <input type="number" min="1" x-model.number="newCatForm.code" placeholder="Ej: 13" class="w-full input-large border rounded-xl">
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Nombre de la Partida</label>
          <input type="text" x-model="newCatForm.name" placeholder="Ej: Publicidad y Mercadeo" class="w-full input-large border rounded-xl">
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Presupuesto Mensual Asignado ($)</label>
          <input type="number" step="10" min="0" x-model.number="newCatForm.monthly_budget_usd" placeholder="Ej: 500.00" class="w-full input-large border rounded-xl">
        </div>

        <div class="grid grid-cols-2 gap-3 pt-4">
          <button @click="showNewCatModal = false" class="py-2.5 px-3 bg-gray-100 rounded-xl text-gray-700 font-bold hover:bg-gray-200 text-sm">Cancelar</button>
          <button @click="saveNewCategory()" class="py-2.5 px-3 bg-tev-green text-white rounded-xl font-bold shadow hover:bg-tev-darkgreen text-sm">Crear Partida</button>
        </div>
      </div>
    </div>
