    <!-- MODAL CAMBIAR CONTRASEÑA -->
    <div x-show="showChangePasswordModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
      <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full border border-gray-100 space-y-4">
        <h3 class="text-xl font-bold text-gray-900">🔑 Cambiar Mi Contraseña</h3>
        <form @submit.prevent="changeOwnPassword()" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Contraseña Actual</label>
            <input type="password" x-model="changePasswordForm.old_password" required class="w-full p-2.5 border rounded-xl">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Nueva Contraseña</label>
            <input type="password" x-model="changePasswordForm.new_password" required minlength="4" class="w-full p-2.5 border rounded-xl">
          </div>
          <div class="grid grid-cols-2 gap-3 pt-4">
            <button type="button" @click="showChangePasswordModal = false" class="p-2.5 bg-gray-100 rounded-xl text-gray-700 font-bold">Cancelar</button>
            <button type="submit" class="p-2.5 bg-tev-green text-white rounded-xl font-bold shadow">Actualizar</button>
          </div>
        </form>
      </div>
    </div>
