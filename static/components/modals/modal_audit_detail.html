    <!-- MODAL DETALLE DE AUDITORÍA -->
    <div x-show="showAuditDetailModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
      <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-lg w-full border border-gray-100 space-y-4">
        <div class="flex items-center justify-between pb-2 border-b border-gray-100">
          <h3 class="text-lg font-bold text-gray-900 flex items-center gap-1.5">
            <span>🛡️ Detalle del Evento de Auditoría</span>
          </h3>
          <span class="text-xs font-mono font-bold bg-slate-100 text-slate-800 px-2 py-0.5 rounded-full" x-text="'ID: #' + selectedAuditDetail?.id"></span>
        </div>
        <div class="space-y-2 text-xs">
          <div class="flex justify-between"><span class="text-gray-500 font-bold">Fecha / Hora:</span><span class="font-mono text-gray-800" x-text="selectedAuditDetail?.timestamp"></span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-bold">Usuario:</span><span class="font-bold text-teal-900 font-mono" x-text="selectedAuditDetail?.username"></span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-bold">Acción:</span><span class="font-bold text-slate-900" x-text="selectedAuditDetail?.action"></span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-bold">Entidad Afectada:</span><span class="text-gray-800" x-text="selectedAuditDetail?.entity_type + ' (' + selectedAuditDetail?.entity_id + ')'"></span></div>
          <div class="flex justify-between"><span class="text-gray-500 font-bold">Dirección IP:</span><span class="font-mono text-gray-700" x-text="selectedAuditDetail?.ip_address || '127.0.0.1'"></span></div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Carga de Datos (Payload JSON)</label>
          <pre class="p-3 bg-slate-900 text-emerald-400 rounded-xl text-[11px] font-mono overflow-x-auto max-h-56 select-all" x-text="formatJsonPayload(selectedAuditDetail?.details_json)"></pre>
        </div>
        <div class="pt-2">
          <button type="button" @click="showAuditDetailModal = false" class="w-full p-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold shadow text-xs">Cerrar Detalle</button>
        </div>
      </div>
    </div>
