    <!-- MODAL RESTABLECER CONTRASEÑA -->
    <div x-show="showResetPasswordModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
      <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full border border-gray-100 space-y-4">
        <h3 class="text-xl font-bold text-gray-900">🔑 Restablecer Contraseña</h3>
        <p class="text-xs text-gray-500">Asignar nueva clave al usuario <strong x-text="selectedUserForReset?.username"></strong></p>
        <form @submit.prevent="resetUserPassword()" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Nueva Contraseña</label>
            <input type="password" x-model="resetPasswordForm.new_password" required minlength="4" class="w-full p-2.5 border rounded-xl">
          </div>
          <div class="grid grid-cols-2 gap-3 pt-4">
            <button type="button" @click="showResetPasswordModal = false" class="p-2.5 bg-gray-100 rounded-xl text-gray-700 font-bold">Cancelar</button>
            <button type="submit" class="p-2.5 bg-purple-700 text-white rounded-xl font-bold shadow">Guardar Clave</button>
          </div>
        </form>
      </div>
    </div>
