    <!-- MODAL TRASPASO / CAMBIO DE MONEDA CON TASA BIDIRECCIONAL -->
    <!-- ======================================================== -->
    <div x-show="showTransferModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm overflow-y-auto">
      <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-lg w-full border border-gray-100 space-y-4 my-auto max-h-[92vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-3 border-b">
          <div>
            <h3 class="text-lg font-black text-gray-900">🔄 Cambio de Moneda / Traspaso</h3>
            <p class="text-xs text-gray-500">Calculadora automática bidireccional por partida doble</p>
          </div>
          <button @click="showTransferModal = false" class="text-gray-400 hover:text-gray-600 font-bold text-xl p-1 rounded-lg hover:bg-gray-100">✕</button>
        </div>

        <form @submit.prevent="executeTransfer()" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">📅 Fecha de la Operación</label>
            <input type="date" x-model="transferForm.date" required class="w-full p-2.5 border rounded-xl">
          </div>

          <!-- Cuentas Origen y Destino -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Cuenta Origen (Sale)</label>
              <select x-model.number="transferForm.origin_account_id" @change="onTransferAccountsChange()" required class="w-full p-2.5 border rounded-xl bg-white text-sm">
                <template x-for="acc in accounts" :key="acc.id">
                  <option :value="acc.id" x-text="acc.name + ' (' + acc.currency + ')'"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Cuenta Destino (Entra)</label>
              <select x-model.number="transferForm.destination_account_id" @change="onTransferAccountsChange()" required class="w-full p-2.5 border rounded-xl bg-white text-sm">
                <template x-for="acc in accounts" :key="acc.id">
                  <option :value="acc.id" x-text="acc.name + ' (' + acc.currency + ')'"></option>
                </template>
              </select>
            </div>
          </div>

          <!-- TASA DE CAMBIO CON BOTÓN DE CÁLCULO BIDIRECCIONAL (IMAGEN 1) -->
          <div class="bg-teal-50 p-4 rounded-2xl border border-teal-200">
            <div class="flex items-center justify-between mb-1">
              <label class="block text-sm font-black text-teal-900">💱 Tasa de Cambio Pactada (Bs / $)</label>
              <span class="text-xs text-teal-700 font-semibold">Cálculo Automático</span>
            </div>
            <div class="flex gap-2">
              <input type="number" step="0.01" min="1" x-model.number="transferForm.exchange_rate" @input="recalcTransfer('rate')" required
                     class="w-full p-2.5 border border-teal-300 rounded-xl font-black text-lg bg-white text-teal-950">
            </div>
          </div>

          <!-- Monto que Sale y Monto que Entra Bidireccional -->
          <div class="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-2xl border border-gray-200">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">
                Monto que Sale (<span class="text-rose-600 font-black" x-text="getAccountCurrency(transferForm.origin_account_id)"></span>)
              </label>
              <input type="number" step="0.01" min="0.01" x-model.number="transferForm.amount_origin" @input="recalcTransfer('origin')" required
                     placeholder="0.00" class="w-full p-2.5 border rounded-xl font-bold text-base">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">
                Monto que Entra (<span class="text-emerald-600 font-black" x-text="getAccountCurrency(transferForm.destination_account_id)"></span>)
              </label>
              <input type="number" step="0.01" min="0.01" x-model.number="transferForm.amount_destination" @input="recalcTransfer('dest')" required
                     placeholder="0.00" class="w-full p-2.5 border rounded-xl font-bold text-base bg-emerald-50 text-emerald-950 border-emerald-300">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">N° Comprobante / Ref</label>
              <input type="text" x-model="transferForm.reference_number" placeholder="Ej: 994201" class="w-full p-2 border rounded-xl text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Motivo / Detalle</label>
              <input type="text" x-model="transferForm.description" placeholder="Ej: Compra de 50 USD efectivo" class="w-full p-2 border rounded-xl text-sm">
            </div>
          </div>

          <button type="submit" class="w-full btn-large bg-tev-green hover:bg-tev-darkgreen text-white shadow font-bold text-base py-3">
            Confirmar Traspaso de Fondos
          </button>
        </form>
      </div>
    </div>
