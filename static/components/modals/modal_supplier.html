    <!-- MODAL REGISTRAR NUEVO PROVEEDOR -->
    <!-- ======================================================== -->
    <div x-show="showSupplierModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
      <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-lg w-full border border-orange-200 space-y-4">
        <div class="flex items-center justify-between pb-3 border-b">
          <div class="flex items-center gap-2">
            <span class="text-2xl">📦</span>
            <div>
              <h3 class="text-lg font-black text-gray-900">Registrar Nuevo Proveedor</h3>
              <p class="text-xs text-gray-500">Quedará guardado en el directorio para futuros pagos</p>
            </div>
          </div>
          <button @click="showSupplierModal = false" class="text-gray-400 hover:text-gray-600 font-bold text-xl p-1 rounded-lg">✕</button>
        </div>

        <form @submit.prevent="saveNewSupplier()" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Razón Social / Nombre Comercial *</label>
            <input type="text" x-model="newSupplierForm.name" required placeholder="Ej: Materiales Eléctricos Carabobo, C.A."
                   class="w-full input-large border border-gray-300 focus:ring-2 focus:ring-orange-500 text-sm">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">RIF / Cédula</label>
              <input type="text" x-model="newSupplierForm.rif" placeholder="Ej: J-12345678-9"
                     class="w-full input-large border border-gray-300 focus:ring-2 focus:ring-orange-500 text-sm uppercase">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Teléfono de Contacto</label>
              <input type="text" x-model="newSupplierForm.phone" placeholder="Ej: 0414-1234567"
                     class="w-full input-large border border-gray-300 focus:ring-2 focus:ring-orange-500 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Datos Bancarios / Pago Móvil</label>
            <textarea x-model="newSupplierForm.bank_details" rows="2" placeholder="Ej: Banesco 0134-... / Pago Móvil 0414... / Zelle: correo@..."
                      class="w-full input-large border border-gray-300 focus:ring-2 focus:ring-orange-500 text-xs"></textarea>
          </div>

          <div class="flex gap-3 pt-3">
            <button type="button" @click="showSupplierModal = false" class="w-1/2 p-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold text-sm">
              Cancelar
            </button>
            <button type="submit" class="w-1/2 p-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-bold text-sm shadow">
              💾 Guardar Proveedor
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ======================================================== -->
