    <!-- MODAL GESTIÓN DE PARTIDA (CON AUDITORÍA Y TRAZABILIDAD) -->
    <div x-show="showEditCatModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm overflow-y-auto">
      <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-md w-full border border-gray-100 space-y-4 my-auto max-h-[92vh] overflow-y-auto">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-teal-100 flex items-center justify-center text-teal-800 text-xl font-bold">⚙️</div>
          <div>
            <h3 class="text-xl font-bold text-gray-900">Gestión de Partida</h3>
            <p class="text-xs text-gray-500">Ajuste de presupuesto y vigencia operativa</p>
          </div>
        </div>

        <!-- Alerta de Trazabilidad Contable -->
        <div class="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-r-xl text-xs text-amber-900">
          <strong>🔒 Trazabilidad Contable Blindada:</strong> El código y nombre no se pueden alterar para proteger el histórico de meses anteriores. Si necesita un nuevo concepto, inactiva esta partida y crea una nueva.
        </div>

        <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-200 space-y-1">
          <div class="text-xs font-bold text-gray-500 uppercase tracking-wider">Partida Registrada:</div>
          <div class="text-base font-black text-gray-900" x-text="editingCat?.code + ' - ' + editingCat?.name"></div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Presupuesto Máximo Mensual ($)</label>
          <input type="number" step="10" min="0" x-model.number="editingCat.monthly_budget_usd" class="w-full input-large border rounded-xl font-bold">
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Estado de Vigencia</label>
          <select x-model="editingCat.is_active" class="w-full input-large border rounded-xl bg-white font-bold"
                  :class="editingCat.is_active ? 'text-emerald-800' : 'text-rose-700'">
            <option :value="true">✅ ACTIVA (Disponible para imputar gastos)</option>
            <option :value="false">🚫 INACTIVA (Retirada de nuevos registros)</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-4">
          <button @click="showEditCatModal = false" class="py-2.5 px-3 bg-gray-100 rounded-xl text-gray-700 font-bold hover:bg-gray-200 text-sm">Cancelar</button>
          <button @click="saveEditedCategory()" class="py-2.5 px-3 bg-tev-green text-white rounded-xl font-bold shadow hover:bg-tev-darkgreen text-sm">Guardar Cambios</button>
        </div>
      </div>
    </div>
