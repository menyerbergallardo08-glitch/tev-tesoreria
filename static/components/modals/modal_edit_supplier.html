    <!-- MODAL EDITAR PROVEEDOR -->
    <div x-cloak x-show="showEditSupplierModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm overflow-y-auto">
      <div class="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 max-w-lg w-full border border-amber-200 space-y-4 my-auto max-h-[92vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-3 border-b">
          <div class="flex items-center gap-2">
            <span class="text-2xl">✏️</span>
            <div>
              <h3 class="text-lg font-black text-gray-900">Editar Datos del Proveedor</h3>
              <p class="text-xs text-gray-500" x-text="editingSupplier?.name"></p>
            </div>
          </div>
          <button @click="showEditSupplierModal = false" class="text-gray-400 hover:text-gray-600 font-bold text-xl p-1 rounded-lg cursor-pointer">✕</button>
        </div>

        <form @submit.prevent="saveEditSupplier()" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Razón Social / Nombre Comercial *</label>
            <input type="text" x-model="editingSupplier.name" required
                   class="w-full input-large border border-gray-300 focus:ring-2 focus:ring-amber-500 text-sm font-bold">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">RIF / Cédula</label>
              <input type="text" x-model="editingSupplier.rif" placeholder="Ej: J-12345678-9"
                     class="w-full input-large border border-gray-300 focus:ring-2 focus:ring-amber-500 text-sm uppercase">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Teléfono de Contacto</label>
              <input type="text" x-model="editingSupplier.phone" placeholder="Ej: 0414-1234567"
                     class="w-full input-large border border-gray-300 focus:ring-2 focus:ring-amber-500 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Datos Bancarios / Pago Móvil</label>
            <textarea x-model="editingSupplier.bank_details" rows="2" placeholder="Ej: Banesco 0134-... / Pago Móvil 0414... / Zelle: correo@..."
                      class="w-full input-large border border-gray-300 focus:ring-2 focus:ring-amber-500 text-xs font-mono"></textarea>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Estado del Proveedor</label>
            <select x-model="editingSupplier.is_active" class="w-full input-large border border-gray-300 bg-white text-xs font-bold">
              <option :value="true">✅ Activo (Disponible para pagos)</option>
              <option :value="false">🚫 Inactivo / Pausado</option>
            </select>
          </div>

          <div class="flex gap-3 pt-3">
            <button type="button" @click="showEditSupplierModal = false" class="w-1/2 p-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold text-sm cursor-pointer">
              Cancelar
            </button>
            <button type="submit" :disabled="isSavingSupplier" class="w-1/2 p-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold text-sm shadow cursor-pointer flex items-center justify-center gap-1.5">
              <span x-show="!isSavingSupplier">💾 Guardar Cambios</span>
              <span x-show="isSavingSupplier">⏳ Guardando...</span>
            </button>
          </div>
        </form>
      </div>
    </div>
