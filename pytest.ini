[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = 
    --cov=services
    --cov=routers
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-fail-under=85
    -v
    --disable-warnings

[coverage:run]
branch = True
omit =
    */__init__.py
    */tests/*

[coverage:report]
show_missing = True
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
